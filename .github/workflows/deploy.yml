name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and pull
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/warehouse-geocoder-utility
            git fetch --prune origin
            git reset --hard origin/main
            npm ci --omit=dev
            npx prisma generate
            sudo /bin/systemctl restart warehouse-geocoder
            sleep 2
            sudo /bin/systemctl status warehouse-geocoder --no-pager
