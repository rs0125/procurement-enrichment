name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node 22 and PostGIS
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: enricher-ci-test
          POSTGRES_DB: enricher_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d enricher_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:enricher-ci-test@127.0.0.1:5432/enricher_test
      ENRICHER_TEST_DATABASE_URL: postgresql://postgres:enricher-ci-test@127.0.0.1:5432/enricher_test
      ENRICHER_QUEUE_TEST_DATABASE_URL: postgresql://postgres:enricher-ci-test@127.0.0.1:5432/enricher_queue_test
      ENRICHER_BACKUP_TEST_DATABASE_URL: postgresql://postgres:enricher-ci-test@127.0.0.1:5432/enricher_test
      ENRICHER_TEST_ENGINE: docker
      CRON_SECRET: ci-only-test-secret
      NODE_ENV: test

    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.21.1'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npm run generate

      - name: Verify CLI and service registration
        run: npm run enrich -- list

      - name: Install pinned PGMQ fixture and isolated queue database
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          python3 tests/fixtures/install-pgmq.py --engine docker --container "$POSTGRES_CONTAINER"
          docker exec "$POSTGRES_CONTAINER" createdb -U postgres enricher_queue_test

      - name: Run unit, HTTP, encoder and database tests
        env:
          ENRICHER_TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: npm test

      - name: Verify deployment guards and rollback
        run: python3 -m unittest discover -s tests -p '*_test.py' -v
